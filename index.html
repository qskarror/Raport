<style>
:root{
 --bg:#f3f5fb;--panel:#fff;--panel2:#f7f9fd;--ink:#0b1220;--mute:#64748b;--line:#e6eaf2;
 --brand:#047857;--brand2:#0e7490;--grad:linear-gradient(135deg,#059669 0%,#0e7490 100%);--on-grad:#fff;--soft:#e6f5ef;
 --danger:#dc2626;--danger-soft:#fee9e9;--warn:#b45309;--warn-soft:#fef3c7;--ok:#15803d;--ok-soft:#dcfce7;
 --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -8px rgba(15,23,42,.08);--sbw:268px;--r:18px
}
:root[data-theme=dark]{
 --bg:#070b13;--panel:#0f1724;--panel2:#0b121d;--ink:#e8eef8;--mute:#8a9ab0;--line:#1d2838;
 --brand:#34d399;--brand2:#22d3ee;--grad:linear-gradient(135deg,#10b981 0%,#0891b2 100%);--on-grad:#031a14;--soft:#102721;
 --danger:#f87171;--danger-soft:#3a1717;--warn:#fbbf24;--warn-soft:#352a0b;--ok:#4ade80;--ok-soft:#0f2f1c;--shadow:0 8px 24px -10px rgba(0,0,0,.6)
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "Plus Jakarta Sans",Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.mu{color:var(--mute)}.sub{color:var(--mute);font-size:12.5px}.grow{flex:1;min-width:0}
svg.ic{width:20px;height:20px;flex:none}
button{font-family:inherit}

/* ===== Sidebar (bisa muncul / disembunyikan) ===== */
.sb{position:fixed;inset:0 auto 0 0;width:var(--sbw);z-index:60;display:flex;flex-direction:column;
 background:linear-gradient(180deg,#0d1626 0%,#0a1019 100%);color:#c7d2e2;border-right:1px solid rgba(255,255,255,.06);
 transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:none}
body.sb-open .sb{transform:none;box-shadow:12px 0 40px -12px rgba(0,0,0,.45)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:18px 16px 14px}
.sb-brand b{display:block;color:#fff;font-size:15px;line-height:1.2;letter-spacing:.02em}
.sb-brand small{color:#7f8ea5;font-size:12px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -6px rgba(16,185,129,.55)}
.sb .logo{color:#fff}
.logo svg{width:22px;height:22px}
.sb .icon-btn{color:#8fa0b8}.sb .icon-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.snav{flex:1;overflow:auto;padding:4px 12px 12px}
.snav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5d6d84;padding:16px 10px 6px;font-weight:700}
.snav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin-bottom:2px;border:0;background:transparent;color:#a8b5c8;font-size:14px;font-weight:500;border-radius:13px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.snav button:hover{background:rgba(255,255,255,.07);color:#fff}
.snav button[aria-current=true]{background:linear-gradient(135deg,#059669,#0e7490);color:#fff;font-weight:600;box-shadow:0 8px 20px -8px rgba(5,150,105,.7)}
.sb-user{display:flex;align-items:center;gap:10px;margin:8px 12px 14px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.sb-user b{display:block;color:#fff;font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user small{color:#8393aa;font-size:11.5px}
.sb-user .av{background:rgba(52,211,153,.15);color:#34d399}
.scrim{position:fixed;inset:0;background:rgba(2,6,16,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}
.main{min-width:0;transition:padding-left .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:901px){body.sb-open .main{padding-left:var(--sbw)}}
@media (max-width:900px){body.sb-open .scrim{opacity:1;pointer-events:auto}.sb{width:min(86vw,300px)}}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0 0 0 4px;flex:1;font-weight:800;letter-spacing:-.01em}
.page{padding:22px 24px 48px;max-width:1120px;margin:0 auto}
@media (max-width:900px){.top{padding:10px 14px}.page{padding:16px 14px 40px}}

/* ===== Komponen ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 4px;font-weight:700}.card .lead{margin:0 0 16px;color:var(--mute);font-size:13.5px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;background:var(--grad);color:var(--on-grad);border-radius:24px;padding:26px 28px;margin-bottom:16px;box-shadow:0 18px 40px -18px rgba(5,150,105,.6)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:220px;height:220px;right:-60px;top:-80px}.hero::after{width:140px;height:140px;right:90px;bottom:-90px;background:rgba(255,255,255,.08)}
.hero h2{margin:0;font-size:22px;font-weight:800;position:relative}.hero p{margin:6px 0 0;opacity:.92;position:relative}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat .bub{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex:none}
.stat .n{font-size:26px;font-weight:800;line-height:1.1}.stat .l{color:var(--mute);font-size:12.5px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.toolbar>label{flex:1 1 170px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mute)}
input,select,textarea{width:100%;margin-top:5px;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);font:inherit;font-weight:500;transition:border-color .15s,box-shadow .15s}
input[type=checkbox]{width:auto;margin:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
input[readonly]{opacity:.65}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--grad);color:var(--on-grad);padding:10px 18px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(5,150,105,.8);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.btn.ghost:hover{background:var(--soft)}
.btn.dng{background:var(--danger);color:#fff;box-shadow:none}.btn.block{width:100%;padding:13px}.btn.sm{padding:7px 13px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:11px;background:transparent;color:var(--mute);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--soft);color:var(--ink)}.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}.icon-btn:disabled{opacity:.35;cursor:default}
.seg{display:inline-flex;background:var(--soft);padding:4px;border-radius:13px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mute);font-weight:600;font-size:13px;padding:8px 15px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tag,.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--brand)}
.tag.ok,.pill.A{background:var(--ok-soft);color:var(--ok)}.tag.warn,.pill.C{background:var(--warn-soft);color:var(--warn)}.pill.D,.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.adm{background:#ede9fe;color:#6d28d9}:root[data-theme=dark] .tag.adm{background:#26194a;color:#c4b5fd}
.pill{min-width:32px;text-align:center}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.item:last-child{border:0;padding-bottom:0}.item:first-child{padding-top:0}
.av{width:42px;height:42px;border-radius:14px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border:0}.tbl tr:hover td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
.tbl input{margin:0;padding:8px 10px}.ni{max-width:100px;text-align:center;font-weight:700}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.alert{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500;margin-bottom:8px;cursor:pointer;border:0;width:100%;text-align:left}
.alert.ok{background:var(--ok-soft);color:var(--ok);cursor:default}
.empty{text-align:center;padding:40px 16px}.empty h2{margin-bottom:6px}.empty p{color:var(--mute);margin:0 0 16px}
.steps{counter-reset:s;display:grid;gap:12px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;font-weight:800;flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;cursor:default}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip.saved i{background:var(--ok)}.chip.saving i{background:var(--warn);animation:pulse 1s infinite}.chip.error{color:var(--danger);cursor:pointer}.chip.error i{background:var(--danger)}
@media (max-width:560px){.chip span{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
@keyframes pulse{50%{opacity:.3}}
.skel{height:96px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),var(--soft),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.checks label{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1.5px solid var(--line);border-radius:99px;cursor:pointer;color:var(--ink);font-weight:600}
.checks label:has(input:checked){border-color:var(--brand);background:var(--soft);color:var(--brand)}
.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.role-box{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--panel2)}
.role-box h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}.role-box ul{margin:0;padding-left:18px;color:var(--mute);font-size:13px}

/* ===== Login ===== */
.login{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:16px;overflow:auto;
 background:radial-gradient(760px 520px at 12% 8%,rgba(16,185,129,.38),transparent 60%),radial-gradient(700px 520px at 92% 92%,rgba(14,116,144,.45),transparent 60%),#060b14}
.login::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%)}
.lbox{position:relative;width:100%;max-width:390px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:34px 28px 28px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);text-align:center;color:#e8eef8}
.lbox .logo{width:68px;height:68px;border-radius:21px;margin:0 auto 18px;color:#fff;box-shadow:0 14px 34px -8px rgba(16,185,129,.7)}.lbox .logo svg{width:34px;height:34px}
.lbox h2{margin:0 0 6px;font-size:25px;font-weight:800;letter-spacing:.12em;color:#fff}
.lbox p{margin:0 0 24px;color:#93a4bc;font-size:14px}
.lbox form{display:grid;gap:14px;text-align:left}
.lbox label{color:#a9b8cd}
.lbox input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#fff;padding:12px 14px}
.lbox input::placeholder{color:#6f7f96}
.lbox input:focus{border-color:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.2)}
.pw{position:relative}.pw input{padding-right:46px}.pw button{position:absolute;right:6px;bottom:4px;width:36px;height:36px;border:0;background:transparent;color:#8fa0b8;border-radius:10px;cursor:pointer;display:grid;place-items:center}.pw button:hover{color:#fff}
.lbox .btn{background:linear-gradient(135deg,#10b981,#0891b2);color:#031a14}
.err{color:#fca5a5;font-size:13px;min-height:0}
.lfoot{margin-top:18px;font-size:12px;color:#6f7f96}

/* ===== Dialog, toast ===== */
dialog{border:0;border-radius:24px;padding:0;width:calc(100% - 24px);max-width:600px;background:var(--panel);color:var(--ink);box-shadow:0 30px 90px rgba(0,0,0,.4);max-height:92vh}
dialog::backdrop{background:rgba(4,10,20,.6);backdrop-filter:blur(3px)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}.dh h3{margin:0;font-size:18px;font-weight:800}
.db{padding:8px 20px 14px}.df{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 20px}
.db .g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.span2{grid-column:1/-1}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.db .g{grid-template-columns:1fr}}
.sec-t{font-weight:700;font-size:13px;margin-top:4px}
#toasts{position:fixed;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2000;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:ti .25s}
.toast.bad{background:var(--danger);color:#fff}
@keyframes ti{from{transform:translateY(10px);opacity:0}}

/* ===== Pratinjau & lembar raport ===== */
.preview{background:#cbd5e1;padding:16px;border-radius:18px;overflow:hidden}
[data-theme=dark] .preview{background:#05080e}
.sheet{background:#fff;color:#000;width:190mm;min-height:270mm;margin:0 auto;padding:10mm 8mm;font:12px/1.4 "Times New Roman",Times,serif}
.sheet .kop{text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:10px}
.sheet .kop b{font-size:17px;display:block}.sheet .kop span{font-size:11px}
.sheet h3{text-align:center;margin:8px 0;font-size:14px;letter-spacing:.5px}
.sheet table{width:100%;border-collapse:collapse}.sheet .id td{padding:1px 4px;vertical-align:top}
.sheet .gr th,.sheet .gr td{border:1px solid #000;padding:3px 5px}.sheet .gr th{background:#e8e8e8}
.sheet .c{text-align:center}.sheet .sec{font-weight:bold;margin:10px 0 3px}
.sheet .box{border:1px solid #000;padding:6px;min-height:40px}
.sheet .ttd{display:flex;justify-content:space-between;text-align:center;margin-top:18px}.sheet .ttd div{width:44%}.sheet .ttd .sp{height:58px}
#printArea{display:none}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff}
 #shell,.sb,.scrim,#toasts,dialog,#login{display:none!important}
 #printArea{display:block}
 #printArea .sheet{margin:0;width:auto;min-height:0;padding:0;page-break-after:always;break-after:page}
 #printArea .sheet:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="login hidden">
 <div class="lbox">
  <div class="logo" id="lg"></div>
  <h2>IRSYADUL ULUM</h2>
  <p>Silakan masuk ke Aplikasi Raport</p>
  <form id="fLogin">
   <label>Username<input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Masukkan username" required></label>
   <label>Password<span class="pw"><input id="lp" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button type="button" id="lpw" aria-label="Tampilkan password"></button></span></label>
   <div id="lerr" class="err" role="alert"></div>
   <button class="btn block" id="lbtn">Masuk</button>
  </form>
  <div class="lfoot">Admin/TU · Guru/Pengajar</div>
 </div>
</div>

<!-- Sidebar -->
<aside class="sb" id="sb" aria-label="Menu utama">
 <div class="sb-brand"><div class="logo" id="lg2"></div><div class="grow"><b id="brandName">IRSYADUL ULUM</b><small>Aplikasi Raport</small></div><button class="icon-btn" data-act="sb" title="Sembunyikan menu" id="b-sbx"></button></div>
 <nav class="snav" id="snav"></nav>
 <div class="sb-user" id="suser"></div>

 <div class="main">

   <button class="icon-btn" data-act="sb" title="Tampilkan / sembunyikan menu" id="b-menu"></button>

   <button class="chip" id="st" data-act="retry"><i></i><span>Memuat…</span></button>
   <button class="icon-btn" data-act="reload" title="Muat ulang data" id="b-reload"></button>
   <button class="icon-btn" data-act="theme" title="Ganti tema" id="b-theme"></button>
  </header>
  <main class="page" id="view"></main>
 </div>
</div>

<dialog id="dlg"></dialog>
<dialog id="cfm"></dialog>
<div id="toasts"></div>
<div id="printArea"></div>

<script>
/* ===== Konfigurasi ===== */
const API_URL='https://script.google.com/macros/s/AKfycbwJhOmcFVZSpS6dpthxpv-ztXxNg7_RvDbIVHuF0AXCuBkO9TqTHB0REnT2ctVkn0ru/exec';
const DEF_SEKOLAH='TPQ Irsyadul Ulum',DEF_ALAMAT="Jl. Cempaka Wa'duwa' Paseseh Tanjung Bumi Bangkalan";
const TPQ_MAPEL=["Baca Tulis Al-Qur'an","Tajwid","Hafalan Surah","Fiqih","Doa Harian","Akhlak"];
const TPL=["Pertahankan semangat belajarnya dan tingkatkan keaktifan di kelas.","Perlu lebih rajin mengulang bacaan dan hafalan di rumah.","Sangat baik. Terus tingkatkan kelancaran bacaan dan hafalan.","Perlu bimbingan tambahan dalam membaca Al-Qur'an; mohon dukungan orang tua."];
const ROLE_LABEL={admin:'Admin / TU',guru:'Guru / Pengajar'};

/* ===== Util ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== API & sesi ===== */
let token=null,USER=null;try{token=localStorage.getItem('raport_token')}catch(e){}
async function api(action,payload={}){
 let r;
 try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...payload})})}
 catch(e){throw Object.assign(new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'),{code:'NET'})}
 let j;try{j=await r.json()}catch(e){throw Object.assign(new Error('Respons server tidak valid. Pastikan deployment Apps Script sudah diperbarui.'),{code:'BAD'})}
 if(!j.ok){if(j.code==='AUTH'){setToken(null);USER=null;showLogin()}throw Object.assign(new Error(j.error||'Gagal'),{code:j.code})}
 return j;
}
function setToken(t){token=t;try{t?localStorage.setItem('raport_token',t):localStorage.removeItem('raport_token')}catch(e){}}
function showLogin(){$('#login').classList.remove('hidden');$('#shell').classList.add('hidden');document.body.classList.remove('sb-open');setTimeout(()=>$('#lu').focus(),50)}
function showApp(){$('#login').classList.add('hidden');$('#shell').classList.remove('hidden');initSb()}

 try{
  const j=await api('login',{username:$('#lu').value.trim(),password:$('#lp').value});
  setToken(j.token);USER=j.user;$('#lp').value='';showApp();await load();
  if(j.passwordBawaan)setTimeout(()=>toast('Anda masih memakai password bawaan. Ganti sekarang di menu Pengaturan.',true),700);
 }catch(err){$('#lerr').textContent=err.message}
 b.disabled=false;b.textContent='Masuk';
});

function normalize(d){
 d.school=d.school||{};const c=d.school;
 c.sekolah=c.sekolah||DEF_SEKOLAH;c.alamat=c.alamat||DEF_ALAMAT;c.ranking=c.ranking||'ya';
 c.semester=c.semester||'Ganjil';c.tahun=c.tahun||'';c.kepsek=c.kepsek||'';c.nipKepsek=c.nipKepsek||'';c.kota=c.kota||'';
 c.tanggal=c.tanggal||new Date().toISOString().slice(0,10);
 d.mapel=(d.mapel||[]).map(m=>({id:m.id||uid(),nama:m.nama||'',kkm:Number(m.kkm)||0}));
 d.rombel=d.rombel||[];
 d.siswa=(d.siswa||[]).map(s=>({id:s.id||uid(),nama:s.nama||'',kelas:s.kelas||'',nis:s.nis||'',nisn:s.nisn||'',sakit:Number(s.sakit)||0,izin:Number(s.izin)||0,alpa:Number(s.alpa)||0,catatan:s.catatan||'',
  ekskul:[Object.assign({n:'',k:''},(s.ekskul||[])[0]),Object.assign({n:'',k:''},(s.ekskul||[])[1])],nilai:s.nilai||{}}));
 if(isAdmin())d.siswa.forEach(s=>{if(s.kelas&&!d.rombel.some(k=>k.nama===s.kelas))d.rombel.push({nama:s.kelas,wali:'',nip:''})});
 return d;
}
function processData(d,r){
 if(typeof d==='string')d=JSON.parse(d);
 if(!d||!d.school){d={school:{},mapel:isAdmin()?TPQ_MAPEL.map(n=>({id:uid(),nama:n,kkm:70})):[],rombel:[],siswa:[]}}
 S=normalize(d);rev=r||'';loaded=true;dirty=false;fk='Semua';sel=null;setStatus('saved');showApp();render();
}
async function load(){
 loaded=false;$('#view').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';setStatus('load');
 try{const j=await api('get');if(j.user)USER=j.user;processData(j.data,j.rev)}
 catch(e){if(e.code==='AUTH')return;$('#view').innerHTML=`<div class="card empty"><h2>Gagal memuat data</h2><p>${esc(e.message)}</p><button class="btn" data-act="reload">${ic('refresh')} Coba lagi</button></div>`;setStatus('error',e.message)}
}

/* Penyimpanan otomatis */
function setStatus(k,msg){
 const b=$('#st');if(!b)return;
 const map={saved:['saved','Tersimpan'],saving:['saving','Menyimpan…'],error:['error',msg?'Gagal: '+msg.slice(0,40)+' (ketuk untuk ulang)':'Gagal menyimpan'],load:['','Memuat…']};
 const [c,t]=map[k]||['',''];b.className='chip '+c;b.querySelector('span').textContent=t;
}
function save(){if(!loaded)return;dirty=true;setStatus('saving');clearTimeout(tm);tm=setTimeout(flush,800)}
async function flush(){
 if(saving){pending=true;return}
 saving=true;pending=false;const force=forceNext;forceNext=false;
 try{
  const j=await api('save',{data:S,rev,force});
  rev=j.rev;if(!pending){dirty=false;setStatus('saved')}
 }catch(e){
  saving=false;
  if(e.code==='CONFLICT'){setStatus('error','Konflik data');conflict()}
  else if(e.code!=='AUTH')setStatus('error',e.message);
  return;
 }
 saving=false;if(pending)flush();
}
function conflict(){dlg(`<div class="dh"><h3>Data berubah di perangkat lain</h3></div><div class="db"><p class="mu" style="margin:0">Ada perubahan yang tersimpan dari perangkat, tab, atau pengguna lain (misalnya guru yang mengisi nilai). Pilih: muat data terbaru (perubahan di layar ini dibuang) atau timpa dengan data di layar ini.</p></div><div class="df"><button class="btn ghost" data-act="reloadSrv">Muat data terbaru</button><button class="btn dng" data-act="forceSave">Timpa dengan data saya</button></div>`)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ===== Perhitungan ===== */
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:Math.max(0,Math.min(100,n))};
function akhir(n){const p=num(n?.p),k=num(n?.k);if(p===null&&k===null)return null;if(p===null)return k;if(k===null)return p;return Math.round((p+k)/2)}
function predikat(v,kkm){if(v===null)return'-';if(v<kkm)return'D';if(v>=90)return'A';if(v>=80)return'B';return'C'}
const pill=(a,kkm)=>{const p=predikat(a,kkm);return`<span class="pill ${p==='B'?'':p}">${p}</span>`};
function desk(m,v,kkm){if(v===null)return'';return{A:`Menunjukkan penguasaan sangat baik pada materi ${m}.`,B:`Menunjukkan penguasaan yang baik pada materi ${m}.`,C:`Cukup menguasai materi ${m}; perlu latihan lebih lanjut.`,D:`Perlu bimbingan dan remedial pada materi ${m}.`}[predikat(v,kkm)]}
function rata(s){const v=S.mapel.map(m=>akhir(s.nilai[m.id])).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function rank(k){return S.siswa.filter(s=>s.kelas===k).map(s=>({id:s.id,r:rata(s)})).filter(x=>x.r!==null).sort((a,b)=>b.r-a.r)}
const complete=s=>S.mapel.length>0&&S.mapel.every(m=>{const n=s.nilai[m.id];return num(n?.p)!==null&&num(n?.k)!==null});
const tgl=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
const ini=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const kelasList=()=>S.rombel.map(k=>k.nama);
const list=()=>S.siswa.filter(s=>fk==='Semua'||s.kelas===fk);
const cur=()=>{const l=list();return l.find(s=>s.id===sel)||l[0]};
const kelasOpts=v=>kelasList().map(k=>`<option ${k===v?'selected':''}>${esc(k)}</option>`).join('');
const kelasFilter=()=>`<label>Kelas<select data-fk><option ${fk==='Semua'?'selected':''}>Semua</option>${kelasOpts(fk)}</select></label>`;
const emptyCard=(t,p,to,lbl)=>`<div class="card empty"><h2>${t}</h2><p>${p}</p>${to?`<button class="btn" data-act="go" data-tab="${to}">${lbl}</button>`:''}</div>`;

/* ===== Beranda ===== */
function cek(){
 const o=[],c=S.school;
 if(isAdmin()){
  if(!S.rombel.length)o.push({t:'Belum ada kelas',to:'kelas'});
  if(!S.siswa.length)o.push({t:'Belum ada siswa',to:'siswa'});
  if(!c.kepsek)o.push({t:'Nama kepala sekolah belum diisi',to:'atur'});
  S.rombel.filter(k=>!k.wali&&S.siswa.some(s=>s.kelas===k.nama)).forEach(k=>o.push({t:`Wali kelas ${k.nama} belum diisi`,to:'kelas'}));
  const nn=S.siswa.filter(s=>!s.nis).length;if(nn)o.push({t:`${nn} siswa belum memiliki NIS`,to:'siswa'});
 }
 const nl=S.siswa.filter(s=>!complete(s)).length;if(nl)o.push({t:`${nl} siswa nilainya belum lengkap`,to:'nilai'});
 return o;
}
function dash(){

 if(!S.rombel.length){
  if(!isAdmin())return hero+emptyCard('Belum ada kelas yang ditugaskan','Hubungi Admin/TU agar akun Anda dihubungkan ke kelas yang Anda ajar.');
  return hero+`<div class="card"><h2>Mulai dari sini</h2><p class="lead">Ikuti langkah singkat berikut untuk menyiapkan raport.</p><ol class="steps"><li><span>Isi identitas sekolah dan periksa mata pelajaran di <b>Pengaturan</b></span></li><li><span>Tambahkan kelas dan wali kelas di <b>Kelas</b></span></li><li><span>Buat akun guru di <b>Pengguna</b> dan tugaskan ke kelasnya</span></li><li><span>Tambah/impor siswa, isi nilai, lalu cetak raport</span></li></ol><div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="go" data-tab="atur">Buka Pengaturan</button><button class="btn ghost" data-act="go" data-tab="kelas">Tambah Kelas</button></div></div>`;
 }
 const issues=cek();
 const rows=S.rombel.map(k=>{const ss=S.siswa.filter(s=>s.kelas===k.nama),l=ss.filter(complete).length,p=ss.length?Math.round(l/ss.length*100):0,rs=ss.map(rata).filter(x=>x!==null),av=rs.length?(rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(1):'-';
  return`<tr><td><b>${esc(k.nama)}</b><div class="sub">${esc(k.wali||'Wali belum diisi')}</div></td><td>${ss.length}</td><td style="min-width:130px"><div class="bar"><i style="width:${p}%"></i></div><div class="sub">${p}% lengkap</div></td><td>${av}</td></tr>`}).join('');

function exportCsv(){

 const csv='﻿'+[h,...rows].map(r=>r.map(q2).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='nilai-raport'+(fk==='Semua'?'':'-'+fk)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);

function nilaiView(){
 if(!S.mapel.length)return emptyCard('Belum ada mata pelajaran',isAdmin()?'Tambahkan mata pelajaran di Pengaturan.':'Admin/TU belum menyiapkan mata pelajaran.',isAdmin()?'atur':'','Buka Pengaturan');

 const pickerSel=nMode==='mapel'?`<label>Mata pelajaran<select data-nm>${S.mapel.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select></label>`:

 if(!L.length)return head+emptyCard('Belum ada siswa di kelas ini',isAdmin()?'Tambahkan siswa atau ubah filter kelas.':'Belum ada siswa, atau akun Anda belum ditugaskan ke kelas.',isAdmin()?'siswa':'','Ke Data Siswa');

 }else{
  const s=cur(),r=rata(s),rk=rank(s.kelas),pos=rk.findIndex(x=>x.id===s.id)+1;
  info=`Rata-rata ${r===null?'-':r.toFixed(1)}${pos?` · peringkat ${pos} dari ${rk.length}`:''}`;
  body=`<table class="tbl"><tr><th width="30">#</th><th>Mata pelajaran</th><th>Pengetahuan</th><th>Keterampilan</th><th>Akhir</th><th>Pred.</th></tr>${S.mapel.map((x,i)=>nilaiRow(s,x,i+1)).join('')}</table>`;
 }
 return head+`<div class="card"><div class="card-h"><span class="mu grow" id="ninfo">${info}</span></div><div class="scroll">${body}</div><p class="sub" style="margin:12px 0 0">Nilai 0–100. Tekan Enter untuk pindah ke baris berikutnya. Nilai akhir = rata-rata pengetahuan dan keterampilan.</p></div>`;
}

 <tr><td colspan="5" class="c"><b>Rata-rata</b></td><td class="c"><b>${r===null?'-':r.toFixed(1)}</b></td><td colspan="2">${rkTxt}</td></tr></table>
 <div class="sec">B. Ekstrakurikuler</div>

 <div class="ttd"><div>Mengetahui,<br>Orang Tua/Wali<div class="sp"></div>( ........................ )</div><div>${esc(c.kota)}${c.kota?', ':''}${tgl(c.tanggal)}<br>Wali Kelas<div class="sp"></div><b><u>${esc(w.wali)}</u></b><br>${w.nip?'NIP. '+esc(w.nip):''}</div></div>

function aturView(){
 const c=S.school,F=(l,p,v,t='text',x='')=>`<label>${l}<input type="${t}" data-p="${p}" value="${esc(v)}" ${x}></label>`;
 const akun=`<div class="card"><h2>Akun saya</h2><p class="lead">${esc(USER.nama)} · @${esc(USER.username)} · ${ROLE_LABEL[USER.role]}${USER.role==='guru'?'<br>Kelas diampu: '+(USER.kelas.length?esc(USER.kelas.join(', ')):'belum ditugaskan'):''}</p><button class="btn ghost" data-act="passDlg">${ic('shield')} Ganti password</button> <span class="sub" style="margin-left:6px">Sesi berakhir otomatis setelah 6 jam.</span></div>`;
 if(!isAdmin())return akun;
 return`<div class="card"><h2>Identitas sekolah</h2><p class="lead">Tampil di kop dan tanda tangan raport.</p><div class="grid2">
 ${F('Nama sekolah/TPQ','school.sekolah',c.sekolah)}${F('Alamat','school.alamat',c.alamat)}${F('Tahun ajaran','school.tahun',c.tahun,'text','placeholder="2026/2027"')}
 <label>Semester<select data-p="school.semester"><option ${c.semester==='Ganjil'?'selected':''}>Ganjil</option><option ${c.semester==='Genap'?'selected':''}>Genap</option></select></label>
 ${F('Kepala sekolah','school.kepsek',c.kepsek)}${F('NIP kepala sekolah','school.nipKepsek',c.nipKepsek)}${F('Kota penandatanganan','school.kota',c.kota)}${F('Tanggal raport','school.tanggal',c.tanggal,'date')}
 <label>Tampilkan peringkat di raport<select data-p="school.ranking"><option value="ya" ${c.ranking!=='tidak'?'selected':''}>Ya</option><option value="tidak" ${c.ranking==='tidak'?'selected':''}>Tidak</option></select></label></div></div>
 <div class="card"><h2>Mata pelajaran</h2><p class="lead">Urutan di sini sama dengan urutan di raport.</p><div class="scroll"><table class="tbl"><tr><th>Nama</th><th width="90">KKM</th><th width="130"></th></tr>
 ${S.mapel.map((x,i)=>`<tr><td><input data-p="mapel.${i}.nama" value="${esc(x.nama)}"></td><td><input type="number" min="0" max="100" data-p="mapel.${i}.kkm" value="${x.kkm}"></td><td style="white-space:nowrap"><button class="icon-btn" data-act="mv" data-i="${i}" data-d="-1" title="Naik" ${i===0?'disabled':''}>${ic('up')}</button><button class="icon-btn" data-act="mv" data-i="${i}" data-d="1" title="Turun" ${i===S.mapel.length-1?'disabled':''}>${ic('down')}</button><button class="icon-btn danger" data-act="delMapel" data-i="${i}" title="Hapus">${ic('trash')}</button></td></tr>`).join('')}</table></div>
 <div style="margin-top:14px"><button class="btn" data-act="addMapel">${ic('plus')} Tambah mata pelajaran</button></div></div>`+akun;
}

/* ===== Aksi (klik) ===== */
const A={};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
A.sb=()=>toggleSb();A.sbclose=()=>toggleSb(false);
A.go=b=>{tab=b.dataset.tab;q='';if(tab==='pengguna')U=null;render();window.scrollTo(0,0);if(isMobile())toggleSb(false)};
A.closeDlg=()=>$('#dlg').close();
A.reload=async()=>{if(dirty&&!await ask('Ada perubahan yang belum tersimpan. Tetap muat ulang?','Muat ulang'))return;U=null;load()};
A.reloadSrv=()=>{$('#dlg').close();dirty=false;load()};
A.forceSave=()=>{$('#dlg').close();forceNext=true;flush()};
A.retry=()=>{if($('#st').classList.contains('error'))flush()};
A.theme=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('raport_theme',t)}catch(e){}$('#b-theme').innerHTML=ic(t==='dark'?'sun':'moon')};
A.logout=async()=>{if(!await ask('Keluar dari aplikasi?','Keluar',false))return;try{await api('logout')}catch(e){}setToken(null);S=null;USER=null;U=null;loaded=false;tab='dash';showLogin()};
A.mode=b=>{nMode=b.dataset.m;render()};
A.addKelas=()=>{let n=S.rombel.length+1;while(S.rombel.some(k=>k.nama==='Kelas '+n))n++;S.rombel.push({nama:'Kelas '+n,wali:'',nip:''});save();render()};
A.delKelas=async b=>{const k=S.rombel[+b.dataset.i];if(S.siswa.some(s=>s.kelas===k.nama)){toast(`Kelas ${k.nama} masih memiliki siswa.`,true);return}if(await ask(`Hapus kelas <b>${esc(k.nama)}</b>?`)){S.rombel.splice(+b.dataset.i,1);save();render()}};
A.addMapel=()=>{S.mapel.push({id:uid(),nama:'Mata pelajaran baru',kkm:70});save();render()};
A.delMapel=async b=>{const m=S.mapel[+b.dataset.i];if(await ask(`Hapus <b>${esc(m.nama)}</b> beserta semua nilainya?`)){S.siswa.forEach(s=>delete s.nilai[m.id]);S.mapel.splice(+b.dataset.i,1);save();render()}};
A.mv=b=>{const i=+b.dataset.i,j=i+ +b.dataset.d;[S.mapel[i],S.mapel[j]]=[S.mapel[j],S.mapel[i]];save();render()};
A.addSiswa=()=>siswaDlg(null);A.editSiswa=b=>siswaDlg(b.dataset.id);A.importDlg=importDlg;A.exportCsv=exportCsv;
A.delSiswa=async b=>{const s=S.siswa.find(x=>x.id===b.dataset.id);if(await ask(`Hapus siswa <b>${esc(s.nama)}</b>?`)){S.siswa=S.siswa.filter(x=>x!==s);save();render()}};
A.print=b=>{$('#printArea').innerHTML=b.dataset.w==='all'?list().map(sheet).join(''):sheet(cur());window.print()};
A.addUser=()=>userDlg(null);A.editUser=b=>userDlg(b.dataset.u);
A.delUser=async b=>{const un=b.dataset.u;if(!await ask(`Hapus pengguna <b>@${esc(un)}</b>? Akun ini tidak bisa masuk lagi.`))return;try{await api('userDelete',{username:un});toast('Pengguna dihapus.');U=null;render()}catch(e){toast(e.message,true)}};
A.passDlg=()=>dlg(`<form id="fPass"><div class="dh"><h3>Ganti password</h3><button type="button" class="icon-btn" data-act="closeDlg">${ic('x')}</button></div><div class="db" style="display:grid;gap:12px"><label>Password lama<input type="password" name="lama" autocomplete="current-password" required></label><label>Password baru (min. 6 karakter)<input type="password" name="baru" autocomplete="new-password" minlength="6" required></label><label>Ulangi password baru<input type="password" name="ulang" autocomplete="new-password" required></label></div><div class="df"><button type="button" class="btn ghost" data-act="closeDlg">Batal</button><button class="btn">Simpan</button></div></form>`);

/* ===== Form ===== */
document.addEventListener('submit',async e=>{
 const f=e.target;if(!['fSiswa','fImport','fPass','fUser'].includes(f.id))return;e.preventDefault();const d=Object.fromEntries(new FormData(f));
 if(f.id==='fSiswa'){
  const id=f.dataset.id,o=id?S.siswa.find(x=>x.id===id):{id:uid(),nilai:{}};
  const common={sakit:+d.sakit||0,izin:+d.izin||0,alpa:+d.alpa||0,catatan:d.catatan,ekskul:[{n:d.e1n.trim(),k:d.e1k.trim()},{n:d.e2n.trim(),k:d.e2k.trim()}]};
  if(isAdmin())Object.assign(o,common,{nama:d.nama.trim(),kelas:d.kelas,nis:d.nis.trim(),nisn:d.nisn.trim()});else Object.assign(o,common);
  if(!id){S.siswa.push(o);sel=o.id}
  $('#dlg').close();save();render();toast('Data siswa disimpan.');
 }else if(f.id==='fImport'){
  const rows=d.data.split(/\r?\n/).map(l=>l.split(/\t|;/).map(x=>x.trim())).filter(r=>r[0]);
  if(rows.length&&/^nama/i.test(rows[0][0]))rows.shift();
  rows.forEach(r=>S.siswa.push({id:uid(),nama:r[0],kelas:d.kelas,nis:r[1]||'',nisn:r[2]||'',sakit:0,izin:0,alpa:0,catatan:'',ekskul:[{n:'',k:''},{n:'',k:''}],nilai:{}}));
  $('#dlg').close();if(rows.length){save();render()}toast(rows.length?`${rows.length} siswa berhasil diimpor.`:'Tidak ada data yang dikenali.',!rows.length);
 }else if(f.id==='fUser'){
  const isNew=f.dataset.new==='1',self=!isNew&&d.username===USER.username;
  const u={username:d.username.trim().toLowerCase(),nama:d.nama.trim(),password:d.password||'',isNew,
   role:self?USER.role:d.role,aktif:self?true:d.aktif!=='0',kelas:new FormData(f).getAll('kelas')};
  const b=f.querySelector('.btn:not(.ghost)');b.disabled=true;
  try{await api('userSave',{u});$('#dlg').close();toast('Pengguna disimpan.');U=null;render()}
  catch(err){toast(err.message,true);b.disabled=false}
 }else{
  if(d.baru!==d.ulang){toast('Konfirmasi password baru tidak sama.',true);return}
  try{await api('ubahPassword',{lama:d.lama,baru:d.baru});$('#dlg').close();toast('Password berhasil diganti.')}catch(err){toast(err.message,true)}
 }
});

/* ===== Input & change ===== */
function setPath(path,val){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.p){setPath(t.dataset.p,t.type==='number'?(parseFloat(t.value)||0):t.value);if(t.dataset.p==='school.sekolah')$('#brandName').textContent=t.value||'IRSYADUL ULUM';save()}
 else if(t.dataset.nilai){
  const [sid,mid,f]=t.dataset.nilai.split('|'),s=S.siswa.find(x=>x.id===sid),m=S.mapel.find(x=>x.id===mid);
  s.nilai[mid]=s.nilai[mid]||{};s.nilai[mid][f]=t.value;save();
  const a=akhir(s.nilai[mid]),tr=t.closest('tr');tr.querySelector('.ca').innerHTML=`<b>${a??'-'}</b>`;tr.querySelector('.cp').innerHTML=pill(a,m.kkm);
 }
 else if('q' in t.dataset){q=t.value;$('#slist').innerHTML=siswaListHtml()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.nilai){const v=t.value;if(v!==''){const n=num(v);if(String(n)!==v){t.value=n;t.dispatchEvent(new Event('input',{bubbles:true}))}}}
 else if('sel' in t.dataset){sel=t.value;render()}
 else if('fk' in t.dataset){fk=t.value;sel=null;render()}
 else if('nm' in t.dataset){nMapel=t.value;render()}
 else if('tpl' in t.dataset){if(t.value)document.querySelector('#fSiswa [name=catatan]').value=t.value}
 else if(t.name==='role'&&t.closest('#fUser')){$('#kelasBox').classList.toggle('hidden',t.value!=='guru')}
 else if(t.dataset.kn!==undefined){
  const i=+t.dataset.kn,old=t.dataset.old,nv=t.value.trim();
  if(!nv||S.rombel.some((k,j)=>j!==i&&k.nama===nv)){toast('Nama kelas tidak boleh kosong atau sama.',true);t.value=old;return}
  S.rombel[i].nama=nv;S.siswa.forEach(s=>{if(s.kelas===old)s.kelas=nv});if(fk===old)fk=nv;t.dataset.old=nv;save();render();
  api('renameKelas',{old,nw:nv}).catch(()=>toast('Penugasan guru belum ikut diperbarui. Periksa menu Pengguna.',true));
 }
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||!e.target.classList.contains('ni'))return;e.preventDefault();
 const all=[...document.querySelectorAll(`.ni[data-col="${e.target.dataset.col}"]`)],i=all.indexOf(e.target),n=all[i+1];
 if(n){n.focus();n.select()}else e.target.blur();
});

/* ===== Mulai ===== */
initIcons();
if(token){showApp();load()}else showLogin();
</script>
</body>
</html>
